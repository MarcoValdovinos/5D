<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>CYMATIC STUDIO · 5D Quantum Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
  body { font-family: 'Courier New', monospace; color: #9fefff; }
  canvas { display: block; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    padding: 16px; display: flex; flex-direction: column;
    justify-content: space-between; z-index: 10;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand { font-size: 20px; font-weight: bold; letter-spacing: 2px;
           color: #00f0ff; text-shadow: 0 0 12px #00f0ff88; }
  .brand span { color: #7a5cff; text-shadow: 0 0 12px #7a5cff88; }
  .stat { text-align: right; font-size: 11px; line-height: 1.6; opacity: 0.85; }
  .stat b { color: #00ff88; }

  .bottom { font-size: 11px; line-height: 1.7; opacity: 0.9; }
  .keys { background: #0a1018cc; border: 1px solid #0a3a3a; border-radius: 10px;
          padding: 10px 14px; display: inline-block; backdrop-filter: blur(6px); }
  .keys b { color: #00f0ff; }

  #state {
    font-size: 12px; letter-spacing: 1px; margin-bottom: 8px;
    color: #ff00e0; text-shadow: 0 0 10px #ff00e088;
    transition: color .3s, text-shadow .3s;
  }
  #state.collapsed { color: #00f0ff; text-shadow: 0 0 10px #00f0ff88; }
</style>
</head>
<body>

<div id="hud">
  <div class="top">
    <div class="brand">CYMATIC<span> · 5D</span></div>
    <div class="stat">
      <div id="fps">-- FPS</div>
      <div>DIM: <b>X·Y·Z·W·V</b></div>
      <div>UNIVERSOS: <b id="uni">8</b></div>
    </div>
  </div>

  <div class="bottom">
    <div id="state">◉ ESTADO: SUPERPOSICIÓN CUÁNTICA</div>
    <div class="keys">
      <b>ESPACIO</b> colapsar &nbsp;·&nbsp;
      <b>Q</b>/<b>F</b> frecuencia &nbsp;·&nbsp;
      <b>1</b>-<b>2</b>-<b>3</b> vista &nbsp;·&nbsp;
      <b>P</b> pausa &nbsp;·&nbsp; <b>ARRASTRA</b> para orbitar
    </div>
  </div>
</div>

<canvas id="canvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   CONFIGURACIÓN BASE
   ============================================================ */
const canvas   = document.getElementById('canvas');
const fpsEl    = document.getElementById('fps');
const stateEl  = document.getElementById('state');
const uniEl    = document.getElementById('uni');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05070d, 1);

const scene  = new THREE.Scene();
scene.fog    = new THREE.FogExp2(0x05070d, 0.028);

const camera = new THREE.PerspectiveCamera(
  55, window.innerWidth / window.innerHeight, 0.1, 400
);

/* ============================================================
   REJILLA DEL SUELO (el "espacio-tiempo" base)
   ============================================================ */
const grid = new THREE.GridHelper(48, 48, 0x00ffcc, 0x0a3a3a);
grid.material.transparent = true;
grid.material.opacity = 0.30;
scene.add(grid);

const grid2 = new THREE.GridHelper(48, 12, 0x00f0ff, 0x00f0ff);
grid2.material.transparent = true;
grid2.material.opacity = 0.10;
grid2.position.y = 0.01;
scene.add(grid2);

/* ============================================================
   PARÁMETROS DE LA ONDA
   N = puntos por onda · LENGTH = longitud del eje X
   ============================================================ */
const N = 420;
const LENGTH = 26;
const NUM_GHOSTS = 7;   // universos paralelos fantasma

/* Onda principal (tu universo colapsado) */
const mainParams = {
  freq: 1.0,     // frecuencia espacial
  amp: 1.9,      // amplitud
  speed: 1.0,    // velocidad temporal (eje W)
};

function makeLine(color, opacity, blending) {
  const positions = new Float32Array(N * 3);
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.LineBasicMaterial({
    color, transparent: true, opacity,
    blending: blending || THREE.NormalBlending,
    depthWrite: false,
  });
  const line = new THREE.Line(geom, mat);
  scene.add(line);
  return { line, geom, mat, positions };
}

const main = makeLine(0x00f0ff, 1.0, THREE.AdditiveBlending);

/* Paleta de colores para los universos fantasma */
const GHOST_COLORS = [0xff00e0, 0x00ff88, 0xffaa00, 0x7a5cff, 0x00d0ff, 0xff4466, 0x44ffaa];

const ghosts = [];
for (let i = 0; i < NUM_GHOSTS; i++) {
  const g = makeLine(GHOST_COLORS[i % GHOST_COLORS.length], 0.45, THREE.AdditiveBlending);
  g.freq  = 0.55 + Math.random() * 0.9;      // frecuencia propia
  g.amp   = 0.7  + Math.random() * 1.4;      // amplitud propia
  g.phase = Math.random() * Math.PI * 2;     // desfase (eje V)
  g.speed = 0.5  + Math.random() * 1.0;      // velocidad propia
  g.dimV  = Math.random() * Math.PI * 2;     // coordenada 5D
  g.dimW  = 0.25 + Math.random() * 0.8;      // coordenada 4D
  ghosts.push(g);
}

/* ============================================================
   PARTÍCULAS DE "ESPUMA CUÁNTICA" (ambiente)
   ============================================================ */
const FOAM = 400;
const foamPos = new Float32Array(FOAM * 3);
for (let i = 0; i < FOAM; i++) {
  foamPos[i*3]     = (Math.random() - 0.5) * 40;
  foamPos[i*3 + 1] = Math.random() * 14 - 1;
  foamPos[i*3 + 2] = (Math.random() - 0.5) * 40;
}
const foamGeom = new THREE.BufferGeometry();
foamGeom.setAttribute('position', new THREE.BufferAttribute(foamPos, 3));
const foamMat = new THREE.PointsMaterial({
  color: 0x00f0ff, size: 0.06, transparent: true,
  opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false,
});
const foam = new THREE.Points(foamGeom, foamMat);
scene.add(foam);

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
let t = 0;                    // tiempo (eje W)
let last = performance.now();
let paused = false;
let collapse = 0;             // 0 = superposición · 1 = colapsado
let collapseTarget = 0;

let fpsAcc = 0, fpsCount = 0;

/* Cámara orbital */
const cam = { theta: 0, phi: 1.15, radius: 17, target: new THREE.Vector3(0, 2.2, 0) };
const camGoal = { theta: 0, phi: 1.15, radius: 17 };

/* ============================================================
   EVALUACIÓN DE LA ONDA EN 5D → PROYECCIÓN 3D
   x  = eje espacial
   y  = amplitud modulada por W (tiempo)
   z  = profundidad modulada por V (universo)
   ============================================================ */
function mainY(x) {
  return 2.2 + mainParams.amp * Math.sin(mainParams.freq * x + t * mainParams.speed);
}
function mainZ(x) {
  return 0.6 * Math.sin(mainParams.freq * 0.5 * x + t * 0.7);
}

function updateMain() {
  const p = main.positions;
  for (let i = 0; i < N; i++) {
    const x = (i / (N - 1) - 0.5) * LENGTH;
    p[i*3]     = x;
    p[i*3 + 1] = mainY(x);
    p[i*3 + 2] = mainZ(x);
  }
  main.geom.attributes.position.needsUpdate = true;
}

function updateGhosts() {
  for (const g of ghosts) {
    const p = g.positions;
    for (let i = 0; i < N; i++) {
      const x = (i / (N - 1) - 0.5) * LENGTH;

      /* Onda propia del universo paralelo */
      const gy = 2.2 + g.amp *
        Math.sin(g.freq * x + t * g.speed + g.phase) *
        Math.cos(g.dimW * x * 0.35 + t * 0.25);

      const gz = 1.0 *
        Math.sin(g.freq * 0.6 * x + t * g.speed * 0.8 + g.dimV) *
        Math.cos(g.freq * 0.25 * x + t * 0.4);

      /* Colapso: interpolamos hacia la onda principal */
      p[i*3]     = x;
      p[i*3 + 1] = gy + (mainY(x) - gy) * collapse;
      p[i*3 + 2] = gz + (mainZ(x) - gz) * collapse;
    }
    g.geom.attributes.position.needsUpdate = true;
    g.mat.opacity = (1 - collapse) * 0.45;
  }
}

/* ============================================================
   CÁMARA
   ============================================================ */
function updateCamera(dt) {
  cam.theta  += (camGoal.theta  - cam.theta)  * Math.min(1, dt * 3);
  cam.phi    += (camGoal.phi    - cam.phi)    * Math.min(1, dt * 3);
  cam.radius += (camGoal.radius - cam.radius) * Math.min(1, dt * 3);

  const sp = Math.sin(cam.phi);
  camera.position.set(
    cam.radius * sp * Math.sin(cam.theta),
    cam.radius * Math.cos(cam.phi) + 2.2,
    cam.radius * sp * Math.cos(cam.theta)
  );
  camera.lookAt(cam.target);
}

/* ============================================================
   BUCLE PRINCIPAL
   ============================================================ */
function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (!paused) t += dt * 1.3;

  /* Medidor de FPS */
  fpsAcc += dt; fpsCount++;
  if (fpsAcc > 0.4) {
    fpsEl.textContent = Math.round(fpsCount / fpsAcc) + ' FPS';
    fpsAcc = 0; fpsCount = 0;
  }

  /* Suavizado del colapso */
  collapse += (collapseTarget - collapse) * Math.min(1, dt * 3.2);

  /* Actualizar estado visual del HUD */
  if (collapse > 0.5) {
    stateEl.textContent = '◉ ESTADO: COLAPSO · UNIVERSO ÚNICO';
    stateEl.classList.add('collapsed');
    uniEl.textContent = '1';
  } else {
    stateEl.textContent = '◉ ESTADO: SUPERPOSICIÓN CUÁNTICA';
    stateEl.classList.remove('collapsed');
    uniEl.textContent = String(NUM_GHOSTS + 1);
  }

  /* Deriva lenta de la espuma cuántica */
  const fp = foamGeom.attributes.position.array;
  for (let i = 0; i < FOAM; i++) {
    fp[i*3 + 1] += Math.sin(t * 0.5 + i) * 0.002;
    fp[i*3]     += Math.cos(t * 0.3 + i) * 0.002;
  }
  foamGeom.attributes.position.needsUpdate = true;

  updateMain();
  updateGhosts();
  updateCamera(dt);

  renderer.render(scene, camera);
}

/* ============================================================
   CONTROLES
   ============================================================ */
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();

  if (e.code === 'Space') {
    e.preventDefault();
    collapseTarget = collapseTarget > 0.5 ? 0 : 1;
  }
  if (k === 'q') mainParams.freq = Math.max(0.2, mainParams.freq - 0.15);
  if (k === 'f') mainParams.freq = Math.min(3.5, mainParams.freq + 0.15);
  if (k === 'p') paused = !paused;

  if (k === '1') { camGoal.theta = 0;      camGoal.phi = 1.15; camGoal.radius = 17; }
  if (k === '2') { camGoal.theta = 0;      camGoal.phi = 1.57; camGoal.radius = 16; }
  if (k === '3') { camGoal.theta = 0;      camGoal.phi = 0.08; camGoal.radius = 20; }
});

/* Órbita con ratón / táctil */
let dragging = false, lastX = 0, lastY = 0;

function onDown(x, y) { dragging = true; lastX = x; lastY = y; }
function onMove(x, y) {
  if (!dragging) return;
  const dx = x - lastX, dy = y - lastY;
  lastX = x; lastY = y;
  camGoal.theta -= dx * 0.005;
  camGoal.phi   = Math.max(0.08, Math.min(1.55, camGoal.phi - dy * 0.005));
}
function onUp() { dragging = false; }

canvas.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
window.addEventListener('mouseup', onUp);

canvas.addEventListener('touchstart', e => {
  const t0 = e.touches[0];
  onDown(t0.clientX, t0.clientY);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  const t0 = e.touches[0];
  onMove(t0.clientX, t0.clientY);
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', onUp);

/* Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* Arrancar */
requestAnimationFrame(animate);
</script>
</body>
</html>
